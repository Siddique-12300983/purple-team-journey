name: Roadmap progress

# Redraws the progress bars in README.md whenever the roadmap changes.

on:
  push:
    branches: [main]
    paths:
      - ROADMAP.md
      - README.md
      - scripts/roadmap-progress.py
      - .github/workflows/roadmap-progress.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Redraw the bars
        run: python3 scripts/roadmap-progress.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Bars already match the roadmap, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update roadmap progress bars"
          git push
